[package]
name = "iac-studio"
version = "0.1.0"
description = "Desktop studio for Terraform/OpenTofu and Ansible projects"
authors = ["Felix Günther"]
edition = "2024"
rust-version = "1.97"
# not published; license decision pending (DESIGN.md §14 #9)
publish = false

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name
# (see https://github.com/rust-lang/cargo/issues/8519).
name = "iac_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
camino = "=1.2.6"
ts-rs = "=12.0.1"
cap-std = "=4.0.3"
cap-tempfile = "=4.0.3"
sha2 = "=0.11.1"
toml = "=1.1.8"
toml_edit = "=0.25.17"
tauri-plugin-dialog = "=2.8.3"
notify = { version = "=8.2.0", default-features = false }
pgp = { version = "=0.21.0", default-features = false }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "http2"] }
zip = { version = "=9.0.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
flate2 = "=1.1.10"
tar = { version = "=0.4.46", default-features = false }

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.5", features = ["process"] }
tokio = { version = "=1.54.1", features = ["time", "sync", "process", "io-util", "rt", "macros"] }

[dev-dependencies]
wiremock = "=0.6.5"
tempfile = "=3.27.0"
tokio = { version = "=1.54.1", features = ["macros", "rt", "time", "test-util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"

# See https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
