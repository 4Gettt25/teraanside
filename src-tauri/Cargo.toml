[package]
name = "iac-studio"
version = "0.1.0"
description = "Desktop studio for Terraform/OpenTofu and Ansible projects"
authors = ["Felix Günther"]
edition = "2024"
rust-version = "1.97"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name
# (see https://github.com/rust-lang/cargo/issues/8519).
name = "iac_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
camino = "=1.2.6"
ts-rs = "=12.0.1"
tokio = { version = "=1.54.1", features = ["time", "process", "io-util", "sync", "macros"] }

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["macros", "rt", "time", "test-util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"

# See https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
