name: Supply chain

# Runs on every push/PR (called from ci.yml, blocking) and weekly, because new
# advisories appear without any change in this repository.
on:
  workflow_call:
  schedule:
    - cron: "17 5 * * 1" # Mondays 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_DENY_VERSION: "0.20.2"
  # x86_64-unknown-linux-musl release asset, verified against the GitHub release digest
  CARGO_DENY_SHA256: "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"

jobs:
  audit:
    name: Advisories, licenses, sources, release age
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # crate age check diffs Cargo.lock against the base commit

      - name: Versionsregel for crates (new/changed Cargo.lock entries >= 14 days)
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            BASE=$(git merge-base HEAD origin/main)
          fi
          python3 -I scripts/check-crate-age.py "$BASE"

      - name: Install cargo-deny (checksum verified)
        run: |
          f="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$f" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/$f"
          echo "${CARGO_DENY_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP"
          mkdir -p "$HOME/.local/bin"
          install -m 0755 "$RUNNER_TEMP/cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl/cargo-deny" \
            "$HOME/.local/bin/cargo-deny"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Rust toolchain (cargo metadata for cargo-deny)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - run: scripts/supply-chain.sh
